name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      # Node 21 is the floor for the glob patterns the packages pass to
      # `node --test`; the lockfile and the apps are built on 24.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      # Architecture boundary of the video engine: no vue, nuxt, electron, node
      # builtins or browser globals. `pnpm test` does not run it, and the app
      # that consumes the engine cannot run it either — its checkout has no
      # sibling copy of this repository.
      - run: pnpm --dir packages/tm-cut-core run check
